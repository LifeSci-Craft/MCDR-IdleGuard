name: CI

on:
  push:
    branches: [main]
  pull_request:

# 这里没有任何一步需要写仓库，测试跑的是工作树里的内容 —— 所以把令牌收窄到只读。
permissions:
  contents: read

# 同一个分支连推两次时，前一次的结果已经没有意义；而且 mcdr-matrix 会起真实 MCDR、
# 各作业还会在 tests/ 下写临时产物、抢端口，两套同时跑只会互相干扰。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 版本一律钉死：`mcdreforged>=2.13` 这类范围会随上游漂，而 MCDR 2.16.0 的
# Requires-Python 就是 >=3.9 —— 上游一旦把下限抬到 3.10，Python 3.9 那条腿会在 pip
# 解析阶段直接失败，看起来却像"插件不支持 3.9"。ruff 同理（另两个插件仓库都钉 ==0.17.0）。
#
# action 一律钉到 commit SHA（注释里写发行版）：浮动主版本标签被上游指到别的代码上时，
# 这里跑的东西就悄悄变了。`.github/dependabot.yml` 负责把升级变成可评审的 PR。
jobs:
  test:
    name: 测试与打包（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12', '3.13']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tests/requirements-test.txt

      # 3.9 腿单独装：tests/requirements-test.txt 里钉死的 pytest（9.1.1）自己要求 >=3.10，
      # 而 README 声明的最低 Python 就是 3.9，所以这条腿要装"最后一代仍支持 3.9 的 pytest"。
      - name: 安装依赖（pytest + MCDR，版本钉死）
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.9" ]; then
            pip install 'mcdreforged==2.16.0' 'pytest==8.3.5'
          else
            pip install -r tests/requirements-test.txt
          fi

      - name: 单元 / 集成测试
        run: python -m pytest tests/ -q

      - name: 打包插件
        run: python tools/build.py

      - name: 产物自检（可复现 / 白名单 / 注释剥离 / CHANGELOG 裁剪 / 仍可编译）
        run: python tools/check_artifact.py

      - name: 上传构建产物
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: idle_guard-mcdr
          path: idle_guard-*.mcdr
          if-no-files-found: error

  lint:
    name: 静态检查（ruff）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements-test.txt
      - name: 安装 ruff
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff==0.17.0'
      - name: ruff check（规则集见仓库根 ruff.toml：E9 + F）
        run: python -m ruff check .

  mutation:
    name: 变异检查（守卫是不是真的被测到）
    runs-on: ubuntu-latest
    # 这个作业会把守卫逐个注入到临时副本里再跑测试，挂住的话不该占满 GitHub 的默认 6 小时。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements-test.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
      - name: 每一个变异都必须被某个测试抓住
        run: python tools/mutation_check.py

  mcdr-floor:
    name: 最低支持的 MCDR（2.13.0）与压测 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements-test.txt
      # ⚠️ 这一层必须**钉死到下限**。以前装的是 'mcdreforged>=2.13,<3'（实际解析到最新版），
      # 于是插件声明的最低版本从来没有被跑过 —— 而 mcdreforged.plugin.json 里
      # dependencies 写的正是 >=2.13.0，声明与验证对不上。
      - name: 安装最低支持的 MCDR
        run: |
          python -m pip install --upgrade pip
          pip install pytest 'mcdreforged==2.13.0'
      - name: 在最低版本上跑单元 / 集成测试
        run: python -m pytest tests/ -q
      - name: 压测工具 smoke（工具本身也得有人跑，否则会像 1.1.0 那样悄悄坏掉）
        run: python tools/soak.py --rounds 20

  mcdr-matrix:
    name: 跨 MCDR 版本测试（${{ matrix.mcdr }}）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 最低 + 若干中间 + 最新。tools/mcdr_matrix.py 里的 MIN_MCDR 由
        # mcdreforged.plugin.json 的 dependencies 解析得到，不再各写一份。
        mcdr: ['2.13.0', '2.14.1', '2.15.0', '2.15.7', '2.16.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements-test.txt
      - name: 安装 MCDR ${{ matrix.mcdr }} 与 pytest
        run: |
          python -m pip install --upgrade pip
          pip install 'pytest==9.1.1' 'mcdreforged==${{ matrix.mcdr }}'
      - name: 跑测试套件
        run: python -m pytest tests/ -q

# 说明：mcdr-matrix 这一层是「每个 MCDR 版本都能导入、并跑通测试套件」的 CI 级矩阵。
# 发版前那一轮仍然按项目规矩跑 `python tools/mcdr_matrix.py`
# （起真实 MCDR、逐项核对命令树与输出），它依赖本机的多版本解释器，
# 不放在这里假装成 CI 覆盖。
