# ruff 配置（CI 的 lint 作业用它）
#
# 只启用「一定是问题」的两组规则，不上来就要求重构代码风格：
#   E9 —— 语法 / 运行期错误类
#   F  —— pyflakes：未使用的导入与变量、**未定义的名字**、f-string 问题
#
# 为什么是这两组：当前代码库在它们下面**全部可通过**（真跑过 `ruff check .`），
# 而它们恰好抓住了 1.1.0 里真实存在的两类问题 ——
# `remote.py` 用了没导入的 `Tuple`、`ui.py` 用了没导入的 `Optional`
# （两者都被 `from __future__ import annotations` 掩盖成"运行时没事"），以及一批没用的导入。
#
# 想继续收紧（I001 导入排序、UP 语法现代化、SIM 简化建议等）请先清完存量告警再逐条打开：
# 一次开启全部规则在当前代码上会得到 380 条告警，等于没开。
target-version = "py39"

[lint]
select = ["E9", "F"]

[lint.per-file-ignores]
# 测试里刻意"赋了不用"的变量（持有引用、对齐场景、标记顺序）不值得为它改测试写法
"tests/*" = ["F841", "F811"]
